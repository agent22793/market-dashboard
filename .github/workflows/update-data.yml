on:
  schedule:
    # Every 15 minutes, 13:00-20:59 UTC, weekdays — covers US market hours
    # (9:30am-4:00pm ET = 13:30-20:00 UTC) plus a buffer on each side.
    # UTC doesn't shift for daylight saving, so this runs ~30-60min early/late
    # relative to the actual open/close depending on the time of year — good
    # enough for "near real-time" without hand-adjusting the cron twice a year.
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit data/ back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_ONLY_ON_CHANGE: "true"
        run: python scripts/collect_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.csv
          git diff --quiet --staged || git commit -m "Update market data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
